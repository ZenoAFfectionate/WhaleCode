<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhaleCode Console</title>
  <meta name="description" content="WhaleCode 智能体 Web 控制台：智能体交互、会话管理与数据集评测。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=11" />
</head>
<body data-theme="dark">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">W</div>
        <div>
          <strong>WhaleCode</strong>
          <span class="brand-tag">Agent Control Plane</span>
        </div>
      </div>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item active" data-view="agent">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H8l-4 4V5z"/></svg>
          智能体交互
        </button>
        <button class="nav-item" data-view="benchmarks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6c0-1.1 3.6-2 8-2s8 .9 8 2-3.6 2-8 2-8-.9-8-2zm0 0v6c0 1.1 3.6 2 8 2s8-.9 8-2V6M4 12v6c0 1.1 3.6 2 8 2s8-.9 8-2v-6"/></svg>
          数据集评测
        </button>
      </nav>

      <section class="sessions">
        <div class="section-title">
          <span class="label">历史会话</span>
          <button class="icon-button" id="refreshSessions" title="刷新会话" aria-label="刷新会话">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6"/></svg>
          </button>
        </div>
        <div class="session-list" id="sessionList"></div>
      </section>

      <div class="reactor" aria-label="服务状态">
        <div class="reactor-line">
          <span class="dot" id="serviceDot"></span>
          <strong id="serviceStatus">检测中</strong>
        </div>
        <div class="reactor-line">
          <span class="label">模型</span>
          <strong id="activeModel">未加载</strong>
        </div>
      </div>
    </aside>

    <main class="main">
      <!-- ===================== Agent view ===================== -->
      <section class="view active" id="agentView">
        <div class="agent-layout">
          <div class="agent-primary">
            <header class="vitals" id="agentVitals">
              <div class="vital vital-status">
                <span class="label">状态</span>
                <strong id="vitalStatus">就绪</strong>
              </div>
              <div class="vital">
                <span class="label">步数</span>
                <strong id="vitalStep">0</strong>
              </div>
              <div class="vital">
                <span class="label">用时</span>
                <strong id="vitalElapsed">—</strong>
              </div>
              <div class="vital vital-tokens">
                <span class="label">Tokens</span>
                <strong id="vitalTokens">—</strong>
                <svg class="token-spark" id="tokenSpark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"></svg>
              </div>
              <div class="vitals-spacer"></div>
              <button class="ghost-button" id="traceReportButton" type="button" title="打开最近的 Trace 报告（新窗口）">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
                Trace
              </button>
              <button class="ghost-button icon-only" id="workspaceToggle" type="button" title="工作区文件浏览器" aria-label="打开工作区面板">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5z"/></svg>
              </button>
              <button class="ghost-button icon-only" id="themeToggle" type="button" title="切换主题（浅色/深色）" aria-label="切换主题">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
              </button>
              <button class="ghost-button" id="newSessionButton" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                新会话
              </button>
              <button class="ghost-button danger-button" id="cancelAgentButton" type="button" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                取消运行
              </button>
            </header>

            <div class="tab-bar" id="agentTabs" hidden></div>

            <div class="trace-stream" id="traceStream">
              <div class="trace-inner" id="chatStream"></div>
            </div>

            <form class="composer" id="agentForm">
              <div class="prompt-box">
                <textarea id="promptInput" rows="1" placeholder="输入代码问题、开发任务或调试需求…（⌘K 命令面板）"></textarea>
                <button class="primary-button" id="runAgentButton" type="submit">
                  运行
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
                </button>
              </div>
            </form>
          </div>

          <aside class="workspace-panel" id="workspacePanel" hidden>
            <div class="wp-header">
              <div class="wp-title">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5z"/></svg>
                <strong>工作区</strong>
                <span class="wp-path" id="wpRootPath"></span>
              </div>
              <button class="icon-button" id="wpRefresh" title="刷新目录" aria-label="刷新目录">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6"/></svg>
              </button>
              <button class="icon-button" id="wpClose" title="收起面板" aria-label="收起面板">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div class="wp-tree" id="wpTree" role="tree" aria-label="工作区文件树"></div>
            <div class="wp-viewer" id="wpViewer" hidden></div>
          </aside>
        </div>
      </section>

      <!-- ===================== Benchmarks view ===================== -->
      <section class="view" id="benchmarksView">
        <header class="view-header">
          <h1>数据集评测</h1>
          <p>选择数据集，调用项目现有 benchmark 脚本，实时查看进度、日志与通过率。</p>
        </header>

        <div class="bench-body">
          <div class="bench-grid">
            <section class="panel">
              <div class="panel-header">
                <div>
                  <h2>数据集</h2>
                  <p>可多选，后端调用对应 benchmark 脚本。</p>
                </div>
              </div>
              <div class="dataset-grid" id="datasetGrid"></div>
              <form class="bench-form" id="benchForm">
                <label class="bench-model-label">
                  <span class="label">模型</span>
                  <input id="benchModel" type="text" placeholder="留空使用当前模型" />
                </label>
                <label>
                  <span class="label">Limit</span>
                  <input id="benchLimit" type="number" min="1" placeholder="小样本" />
                </label>
                <label>
                  <span class="label">pass@k</span>
                  <select id="benchPassK">
                    <option value="pass@1">pass@1</option>
                    <option value="pass@3">pass@3</option>
                    <option value="pass@5">pass@5</option>
                  </select>
                </label>
                <button class="primary-button" id="runBenchButton" type="submit">运行评测</button>
                <button class="ghost-button danger-button" id="cancelBenchButton" type="button" hidden>取消评测</button>
              </form>
            </section>

            <aside class="panel">
              <div class="panel-header">
                <div>
                  <h2>实时日志</h2>
                  <p>benchmark 脚本 stdout。</p>
                </div>
              </div>
              <div class="log-stream" id="benchLog">
                <div class="log-empty">运行后在此实时输出。</div>
              </div>
            </aside>
          </div>

          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>评测结果</h2>
                <p>以通过率为头条；展开可查看用例明细与运行轨迹。</p>
              </div>
              <div class="results-toolbar">
                <input id="historyFilter" type="search" placeholder="筛选数据集 / 模型" />
                <select id="historySort">
                  <option value="time">按时间倒序</option>
                  <option value="name">按名称排序</option>
                  <option value="rate">按通过率排序</option>
                </select>
              </div>
            </div>
            <div class="bench-chart" id="benchChart" hidden></div>
            <div class="history-table" id="historyTable"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <!-- ===================== Command palette (C9) ===================== -->
  <div class="cmdk-overlay" id="cmdkOverlay" hidden>
    <div class="cmdk" role="dialog" aria-label="命令面板">
      <div class="cmdk-input-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="cmdkInput" type="text" placeholder="输入命令或搜索…" autocomplete="off" />
        <kbd>Esc</kbd>
      </div>
      <div class="cmdk-list" id="cmdkList" role="listbox"></div>
    </div>
  </div>

  <script type="module" src="./app.js?v=11"></script>
</body>
</html>
